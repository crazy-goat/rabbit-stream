name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The required status check is `ci-ok`. Fork pull requests need a maintainer's approval to run
# workflows (repository/organisation setting), so no actor check is needed here.
jobs:
  changes:
    name: Changes
    uses: crazy-goat/.github/.github/workflows/changes.yml@main
    with:
      # Everything else (src/, tests/, bin/, composer.json, phpunit.xml, workflows ...) is code.
      # examples/ and README.md are code too: docs-check and the docs link check read them.
      docs-regex: '^(AGENTS\.md|CHANGELOG\.md|LICENSE.*|\.gitignore|\.gitattributes|docs/.*|\.github/ISSUE_TEMPLATE/.*|\.github/pull_request_template\.md)$'

  docs:
    name: Docs
    uses: crazy-goat/.github/.github/workflows/docs-check.yml@main

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install shellcheck
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz \
            | tar -xJ --strip-components=1 -C "$HOME/.local/bin" shellcheck-v0.11.0/shellcheck
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint
        run: bin/lint.sh

  unit-tests:
    name: unit-tests (PHP ${{ matrix.php }})
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4"]
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run unit tests
        run: ./vendor/bin/phpunit --testsuite unit --testdox

  e2e-tests:
    name: e2e-tests
    needs: [changes, lint]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run E2E tests
        run: ./run-e2e.sh

      - name: Smoke-run examples
        env:
          RABBITMQ_HOST: 127.0.0.1
          RABBITMQ_PORT: 5552
        run: bin/run-examples.sh

  ci-ok:
    name: ci-ok
    needs: [changes, docs, lint, unit-tests, e2e-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          CODE: ${{ needs.changes.outputs.code }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Code changes: $CODE"
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in failure|cancelled) exit 1 ;; esac
          done
          # Documentation-only changes skip the heavy jobs; code changes need all of them.
          if [ "$CODE" = "true" ]; then
            for r in $RESULTS; do
              [ "$r" = "success" ] || exit 1
            done
          fi
